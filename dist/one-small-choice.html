<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONE SMALL CHOICE</title>
<meta name="description" content="小さな選択が、世界を変える。バタフライエフェクトをテーマにしたシミュレーションゲーム。">
<meta name="theme-color" content="#F5F6F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Jost:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* =========================================================
   ONE SMALL CHOICE — スタイル
   レイアウト: 縦長1カラム（スマホ縦画面基準）。PCでは中央の細い柱に収め、比較画面のみ2列を広げる。
   ========================================================= */
:root {
  /* color */
  --paper: #F5F6F3;        /* 地の色：わずかに緑灰に寄せたオフホワイト */
  --card: #FFFFFF;
  --ink: #23313A;          /* 文字：深いスレート */
  --ink-2: #5D6A71;
  --ink-3: #97A2A7;
  --line: #DCE2E0;
  --line-2: #C6CFCC;
  --blue: #6F9FC2;
  --blue-soft: #E2EDF4;
  --green: #7FB49A;
  --green-soft: #E2EFE7;
  --gray-soft: #ECEFED;
  --ocean: #DCEAF2;
  --land: #B9D6C6;
  --land-line: #9BC2AD;
  --shade: rgba(35, 49, 58, 0.08);
  --veil: rgba(245, 246, 243, 0.86);

  /* impact categories */
  --c-PERSONAL: #8794A0;
  --c-SOCIAL: #CE987E;
  --c-ECONOMY: #C4A55E;
  --c-ENVIRONMENT: #6FAE8C;
  --c-TECHNOLOGY: #7D8FCB;
  --c-CULTURE: #B48CB3;
  --c-GLOBAL: #4E8DB8;

  /* type */
  --f-display: "Jost", "Futura", "Avenir Next", "Helvetica Neue", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
  --f-mono: "DM Mono", "SFMono-Regular", "Menlo", "Consolas", monospace;

  --t-xs: 0.6875rem;  /* 11 */
  --t-sm: 0.8125rem;  /* 13 */
  --t-md: 0.9375rem;  /* 15 */
  --t-lg: 1.125rem;   /* 18 */
  --t-xl: 1.5rem;     /* 24 */
  --t-2xl: 1.875rem;  /* 30 */

  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --col: 520px;
  --ease: cubic-bezier(.22, .61, .36, 1);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-md);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 700; line-height: 1.35; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ---------- app & screens ---------- */
#app { position: relative; height: 100%; overflow: hidden; }
.screen {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  opacity: 0; visibility: hidden;
  transform: translateY(10px);
  transition: opacity .5s var(--ease), transform .6s var(--ease), visibility 0s linear .5s;
}
.screen.is-active {
  opacity: 1; visibility: visible; transform: none;
  transition: opacity .5s var(--ease) .08s, transform .6s var(--ease) .08s, visibility 0s;
}
.wrap {
  width: 100%; max-width: var(--col); margin: 0 auto;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.screen > .wrap { padding-block: 8px 48px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--veil);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid transparent;
}
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; padding-block: 6px; }
.topbar.is-scrolled { border-bottom-color: var(--line); }
.icon-btn {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center;
  background: transparent; border: 1px solid var(--line); cursor: pointer;
  transition: background .2s, border-color .2s;
}
.icon-btn:hover { background: var(--card); border-color: var(--line-2); }
.icon-btn svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.topbar-title { flex: 1; min-width: 0; font-size: var(--t-xs); color: var(--ink-2); letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title b { font-family: var(--f-mono); font-weight: 400; color: var(--ink-3); margin-right: 8px; }

/* progress: 導入 → 選択 → 連鎖 → 未来 → 比較 */
.progress { display: flex; gap: 4px; align-items: center; flex: none; }
.progress i { width: 18px; height: 3px; border-radius: 2px; background: var(--line); transition: background .4s, width .4s; }
.progress i.on { background: var(--ink-3); }
.progress i.now { background: var(--ink); width: 26px; }

/* ---------- type helpers ---------- */
.eyebrow {
  font-family: var(--f-display); font-weight: 500; font-size: var(--t-xs);
  letter-spacing: .24em; text-transform: uppercase; color: var(--ink-3);
}
.eyebrow .num { font-family: var(--f-mono); letter-spacing: .08em; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.note { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.6; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 54px; padding: 0 28px; border-radius: 999px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
  font-family: var(--f-display); font-weight: 500; font-size: var(--t-sm); letter-spacing: .22em;
  cursor: pointer; transition: transform .2s var(--ease), background .2s, box-shadow .3s;
  text-decoration: none;
}
.btn:hover { box-shadow: 0 8px 24px -10px rgba(35, 49, 58, .45); }
.btn:active { transform: scale(.98); }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--card); box-shadow: none; border-color: var(--ink-3); }
.btn.block { width: 100%; }
.btn-text {
  background: none; border: 0; padding: 12px 8px; cursor: pointer;
  font-family: var(--f-display); font-size: var(--t-xs); letter-spacing: .22em; color: var(--ink-2);
  min-height: 44px;
}
.btn-text:hover { color: var(--ink); }

/* =========================================================
   ① HOME
   ========================================================= */
#screen-home .wrap {
  min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 0; padding-block: 32px;
}
.home-kicker { margin-bottom: 18px; }
.home-globe { position: relative; width: min(64vw, 290px); aspect-ratio: 1; max-width: 100%; margin: 4px 0 30px; }
.home-globe .orbit { position: absolute; inset: -9%; }
.home-title {
  font-family: var(--f-display); font-weight: 300; font-size: clamp(1.6rem, 7.4vw, 2.4rem);
  letter-spacing: .26em; line-height: 1.2; margin-right: -.26em; color: var(--ink);
}
.home-catch { margin-top: 14px; font-size: var(--t-md); letter-spacing: .14em; color: var(--ink-2); }
.home-actions { margin-top: 38px; display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(100%, 300px); }
.home-actions .btn { width: 100%; margin-bottom: 8px; }
.home-record { margin-top: 26px; font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-3); letter-spacing: .06em; }

/* =========================================================
   GLOBE
   ========================================================= */
.globe { width: 100%; height: 100%; display: block; overflow: visible; }
.globe .g-ocean { fill: var(--ocean); }
.globe .g-land path { fill: var(--land); }
.globe .g-lat { fill: none; stroke: var(--card); stroke-opacity: .7; stroke-width: .6; }
.globe .g-rim { fill: none; stroke: var(--ink); stroke-opacity: .55; stroke-width: .7; }
.globe .g-land-move { animation: globe-spin 46s linear infinite; }
.globe.fast .g-land-move { animation-duration: 30s; }
@keyframes globe-spin { from { transform: translateX(0); } to { transform: translateX(-320px); } }
.globe .g-orbit { fill: none; stroke: var(--ink-3); stroke-width: .5; stroke-dasharray: 1.5 3; }
.globe .g-sat { fill: var(--ink); }
.globe .g-spread circle { fill: none; stroke-width: .8; }
.globe .g-dot { opacity: 0; transform-box: fill-box; transform-origin: center; }
.globe.spreading .g-dot { animation: dot-in .8s var(--ease) forwards; }
@keyframes dot-in { 0% { opacity: 0; transform: scale(0); } 70% { opacity: 1; transform: scale(1.5); } 100% { opacity: .95; transform: scale(1); } }
.globe .g-ring { opacity: 0; transform-box: fill-box; transform-origin: center; }
.globe.spreading .g-ring { animation: ring 3.6s var(--ease) infinite; }
@keyframes ring { 0% { opacity: .8; transform: scale(.2); } 100% { opacity: 0; transform: scale(3.2); } }
.globe .g-tint { opacity: 0; transition: opacity 3s var(--ease) .6s; }
.globe.spreading .g-tint { opacity: .5; }

/* tones of the future */
.tone-green { --tone: #6FAE8C; --tone-soft: #DDEFE4; }
.tone-blue  { --tone: #5E97C0; --tone-soft: #DCEAF4; }
.tone-gray  { --tone: #8C989E; --tone-soft: #E7EBEA; }
.tone-amber { --tone: #C49A55; --tone-soft: #F3EAD8; }
.tone-violet{ --tone: #9C8BC0; --tone-soft: #E9E4F3; }

/* =========================================================
   COLLECTION
   ========================================================= */
.page-head { padding: 18px 0 22px; display: grid; gap: 8px; }
.page-head h1 { font-family: var(--f-display); font-weight: 300; letter-spacing: .18em; font-size: var(--t-xl); }
.page-head p { color: var(--ink-2); font-size: var(--t-sm); }
.found-bar { display: flex; align-items: center; gap: 12px; margin-top: 6px; font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-2); }
.found-bar .track { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.found-bar .track i { display: block; height: 100%; background: var(--ink); border-radius: 2px; transition: width 1s var(--ease); }

.scn-list { display: grid; gap: 10px; }
.scn-card {
  display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 14px;
  width: 100%; text-align: left; padding: 14px 16px 14px 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; cursor: pointer;
  transition: border-color .2s, transform .2s var(--ease), box-shadow .3s;
}
.scn-card:hover { border-color: var(--line-2); box-shadow: 0 10px 30px -18px rgba(35, 49, 58, .35); }
.scn-card:active { transform: scale(.99); }
.scn-thumb { width: 58px; height: 58px; border-radius: 12px; background: var(--gray-soft); overflow: hidden; display: grid; place-items: center; }
.scn-thumb svg { width: 100%; height: 100%; }
.scn-body { min-width: 0; display: grid; gap: 2px; }
.scn-body .num { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-3); letter-spacing: .06em; }
.scn-body h3 { font-size: var(--t-md); font-weight: 500; }
.scn-body .theme { font-size: var(--t-xs); color: var(--ink-2); }
.scn-dots { display: flex; gap: 4px; flex-wrap: wrap; max-width: 64px; justify-content: flex-end; }
.scn-dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--line-2); }
.scn-dots i.on { background: var(--ink); border-color: var(--ink); }
.scn-new { font-family: var(--f-display); font-size: 10px; letter-spacing: .2em; color: var(--blue); }

.history { margin-top: 34px; display: grid; gap: 10px; }
.history h2 { font-family: var(--f-display); font-weight: 500; font-size: var(--t-xs); letter-spacing: .24em; color: var(--ink-3); }
.history ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.history li { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: var(--t-sm); }
.history li .y { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-3); padding-top: 2px; }
.history li .t { min-width: 0; color: var(--ink-2); }
.history li .t b { color: var(--ink); font-weight: 500; }

/* =========================================================
   ② SCENARIO
   ========================================================= */
.scn-intro { padding-top: 10px; display: grid; gap: 20px; }
.scn-intro h1 { font-size: var(--t-2xl); letter-spacing: .04em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: var(--t-xs); padding: 3px 10px; border: 1px solid var(--line-2); border-radius: 999px; color: var(--ink-2); }
.illus {
  width: 100%; aspect-ratio: 16 / 10; max-width: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
}
.illus svg { width: 100%; height: 100%; display: block; }
.intro-lines { display: grid; gap: 4px; font-size: var(--t-lg); line-height: 1.8; }
.intro-lines span { display: block; animation: opt-in .9s var(--ease) both; animation-delay: calc(var(--i, 0) * 450ms + 450ms); }
.setting { font-size: var(--t-sm); color: var(--ink-2); padding-left: 14px; border-left: 1px solid var(--line-2); }
.scn-intro .btn { margin-top: 8px; }

/* illustration parts */
.ill { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.ill .fill-blue { fill: var(--blue-soft); }
.ill .fill-green { fill: var(--green-soft); }
.ill .fill-gray { fill: var(--gray-soft); }
.ill .fill-card { fill: var(--card); }
.ill .fill-ink { fill: var(--ink); stroke: none; }
.ill .fill-sun { fill: #F2E3C2; stroke: none; }
.ill .fill-accent-g { fill: var(--green); stroke: none; }
.ill .fill-accent-b { fill: var(--blue); stroke: none; }
.ill .soft { stroke: var(--ink-3); stroke-width: 1; }
.ill .ground { stroke: var(--line-2); stroke-width: 1; }
.ill-part { opacity: 0; transform: translateY(6px); }
.is-active .ill-part, .ill-static .ill-part { animation: part-in .8s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 120ms + 150ms); }
.ill-static .ill-part { animation: none; opacity: 1; transform: none; }
@keyframes part-in { to { opacity: 1; transform: none; } }
.ill .float { animation: floaty 4.5s ease-in-out infinite; transform-box: fill-box; }
@keyframes floaty { 50% { transform: translateY(-3px); } }

/* =========================================================
   ③ CHOICE
   ========================================================= */
.choice-head { padding-top: 14px; display: grid; gap: 14px; }
.choice-head .ctx { font-size: var(--t-sm); color: var(--ink-2); }
.choice-head h1 { font-size: var(--t-xl); }
.choice-note { margin-top: 2px; font-size: var(--t-xs); color: var(--blue); letter-spacing: .04em; }
.options { margin-top: 26px; display: grid; gap: 12px; }
.option {
  position: relative; display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 14px;
  width: 100%; min-height: 76px; padding: 14px 18px 14px 14px; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; cursor: pointer;
  transition: border-color .25s, transform .25s var(--ease), opacity .4s, box-shadow .3s;
  animation: opt-in .6s var(--ease) both; animation-delay: calc(var(--i) * 90ms + 120ms);
}
@keyframes opt-in { from { opacity: 0; transform: translateY(8px); } }
.option:hover { border-color: var(--ink-3); box-shadow: 0 12px 30px -20px rgba(35, 49, 58, .4); }
.option:active { transform: scale(.99); }
.option .key {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2);
  display: grid; place-items: center; font-family: var(--f-display); font-size: var(--t-sm); color: var(--ink-2);
  transition: background .3s, color .3s, border-color .3s;
}
.option .lbl { display: grid; gap: 2px; min-width: 0; }
.option .lbl b { font-weight: 500; font-size: var(--t-md); line-height: 1.5; }
.option .lbl small { font-size: var(--t-xs); color: var(--ink-2); line-height: 1.5; }
.option .seen { position: absolute; top: 10px; right: 14px; font-family: var(--f-display); font-size: 10px; letter-spacing: .16em; color: var(--ink-3); }
.option.is-picked { border-color: var(--ink); }
.option.is-picked .key { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.options.is-done .option:not(.is-picked) { opacity: .25; transform: scale(.98); }
.options.is-done .option { pointer-events: none; }

/* =========================================================
   ④ SIMULATION
   ========================================================= */
#screen-sim { overflow: hidden; display: flex; flex-direction: column; }
#screen-sim .topbar { position: relative; flex: none; }
.sim-status { flex: none; border-bottom: 1px solid var(--line); background: var(--paper); }
.sim-status .wrap { display: grid; gap: 10px; padding-block: 8px 12px; }
.sim-clock { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sim-clock .when { font-size: var(--t-xl); font-weight: 700; letter-spacing: .02em; line-height: 1.2; transition: opacity .3s; }
.sim-clock .year { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-3); white-space: nowrap; }
.scope-meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.scope-meter div { display: grid; gap: 5px; }
.scope-meter i { height: 3px; border-radius: 2px; background: var(--line); transition: background .6s var(--ease); }
.scope-meter span { font-size: 10px; color: var(--ink-3); letter-spacing: .1em; transition: color .4s; }
.scope-meter .on i { background: var(--blue); }
.scope-meter .on span { color: var(--ink-2); }
.scope-meter .now i { background: var(--ink); }
.scope-meter .now span { color: var(--ink); font-weight: 700; }
.scope-meter .pulse i { animation: scope-pulse 1.2s var(--ease); }
@keyframes scope-pulse { 0% { box-shadow: 0 0 0 0 rgba(78, 141, 184, .6); } 100% { box-shadow: 0 0 0 6px rgba(78, 141, 184, 0); } }

.sim-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
.sim-scroll .wrap { padding-block: 18px 140px; }
.timeline { position: relative; padding-left: 58px; display: grid; gap: 12px; }
.timeline > svg.links { position: absolute; left: 0; top: 0; width: 58px; overflow: visible; pointer-events: none; }
.links path { fill: none; stroke-width: 1.3; stroke-linecap: round; opacity: .75; }
.links path.draw { transition: stroke-dashoffset .9s var(--ease); }
.links circle { transition: r .4s var(--ease); }
.links circle.dec { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
.links circle.halo { fill: none; stroke-width: 1; opacity: 0; }
.links circle.halo.go { animation: halo 1.4s var(--ease); }
@keyframes halo { 0% { opacity: .7; r: 4; } 100% { opacity: 0; r: 16; } }

.step {
  position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 16px 15px; display: grid; gap: 6px;
  animation: step-in .7s var(--ease) both;
}
.step.instant { animation-duration: .25s; }
@keyframes step-in { from { opacity: 0; transform: translateY(14px); } }
.step-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: var(--t-xs); }
.step-time { font-family: var(--f-mono); color: var(--ink-2); }
.step-cat { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-display); letter-spacing: .14em; font-size: 10px; color: var(--cat); }
.step-cat svg { width: 13px; height: 13px; stroke: var(--cat); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.step-scope { margin-left: auto; font-size: 10px; color: var(--ink-3); letter-spacing: .1em; }
.step-title { font-size: var(--t-md); font-weight: 700; line-height: 1.5; }
.step-desc { font-size: var(--t-sm); color: var(--ink-2); line-height: 1.75; }
.step-merge { font-size: 10px; color: var(--ink-3); letter-spacing: .06em; display: flex; align-items: center; gap: 6px; }
.step-merge::before { content: ""; width: 14px; height: 1px; background: var(--ink-3); }
.step.big { border-color: var(--c-GLOBAL); box-shadow: 0 14px 34px -22px rgba(78, 141, 184, .7); }
.step.big .step-title { font-size: var(--t-lg); }
.step.you { background: transparent; border-style: dashed; border-color: var(--line-2); }
.step.you .step-cat { color: var(--ink); }
.step.you .step-title { font-weight: 500; }

.scope-divider { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; font-size: var(--t-xs); color: var(--blue); letter-spacing: .12em; animation: step-in .6s var(--ease) both; }
.scope-divider::before, .scope-divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--blue-soft), transparent); }
.scope-divider b { font-weight: 700; color: var(--ink); }

<script>
/* =========================================================
   ONE SMALL CHOICE — 因果関係シミュレーションエンジン
   ---------------------------------------------------------
   ・シナリオデータ（scenarios/*.js）を登録・検証する
   ・プレイヤーの選択（answers）から、時系列のイベント列を計算する

(function (root) {

  var DEFAULT_SCOPE = { PERSONAL: 1, SOCIAL: 3, ECONOMY: 3, ENVIRONMENT: 3, TECHNOLOGY: 3, CULTURE: 3, GLOBAL: 5 };

  /* =========================================================
     条件式の小さな言語

       name      … 変数が 0 より大きい
       #flag     … フラグが立っている
       @eventId  … そのイベントがすでに起きた
       d1:B      … 選択 d1 で B を選んだ（d1:AB なら A か B）

  function tokenize(src) {
    var re = /\s*(>=|<=|==|!=|&&|\|\||[()!<>]|[#@]?[A-Za-z_][\w-]*(?::[A-Za-z]+)?|-?\d+(?:\.\d+)?)/y;

    while (re.lastIndex < s.length) {

    var toks = tokenize(src);
    var i = 0;
    function peek() { return toks[i]; }
    function next() { return toks[i++]; }
    function expect(t) { if (next() !== t) throw new Error('条件式の書き方が違います: "' + src + '"'); }

    function parseOr() {
      var left = parseAnd();
      while (peek() === '||') { next(); var r = parseAnd(); left = (function (a, b) { return function (st) { return a(st) || b(st); }; })(left, r); }

    }
    function parseAnd() {
      var left = parseUnary();
      while (peek() === '&&') { next(); var r = parseUnary(); left = (function (a, b) { return function (st) { return a(st) && b(st); }; })(left, r); }
      return left;
    }
    function parseUnary() {
      if (peek() === '!') { next(); var inner = parseUnary(); return function (st) { return !inner(st); }; }
      if (peek() === '(') { next(); var e = parseOr(); expect(')'); return e; }
      return parseAtom();
    }
    function parseAtom() {
      var t = next();
      if (t == null) throw new Error('条件式が途中で終わっています: "' + src + '"');
      if (t[0] === '#') { var f = t.slice(1); return function (st) { return st.flags.has(f); }; }
      if (t[0] === '@') { var ev = t.slice(1); return function (st) { return st.fired.has(ev); }; }
      if (t.indexOf(':') > 0) {
        var parts = t.split(':'); var dId = parts[0]; var opts = parts[1].split('');
        return function (st) { return opts.indexOf(st.answers[dId]) >= 0; };
      }
      var name = t;
      var op = peek();
      if (op === '>=' || op === '<=' || op === '>' || op === '<' || op === '==' || op === '!=') {
        next();
        var num = parseFloat(next());
        if (isNaN(num)) throw new Error('条件式の数値が読めません: "' + src + '"');
        return function (st) {
          var v = st.vars[name] || 0;
          switch (op) {
            case '>=': return v >= num; case '<=': return v <= num;
            case '>': return v > num; case '<': return v < num;
            case '==': return v === num; default: return v !== num;
          }
        };
      }
      return function (st) { return (st.vars[name] || 0) > 0; };
    }
    var fn = parseOr();
    if (i < toks.length) throw new Error('条件式の余分な記号: "' + src + '"');
    fn.source = src;
    return fn;
  }

  /* ---------- 効果の適用 ---------- */
  function applyEffects(fx, st) {
    if (!fx) return;
    Object.keys(fx).forEach(function (k) {
      if (RESERVED[k]) return;
      st.vars[k] = (st.vars[k] || 0) + fx[k];
    });
    (fx.flags || []).forEach(function (f) { st.flags.add(f); });
    (fx.unflags || []).forEach(function (f) { st.flags.delete(f); });
  }

  /* ---------- 時間の表示 ---------- */
  function formatTime(days) {
    if (days <= 0) return 'その場で';
    if (days < 1) return '当日';
    if (days < 30) return Math.round(days) + '日後';
    if (days < 365) return Math.max(1, Math.round(days / 30)) + 'か月後';
    var y = days / 365;
    if (y < 10 && Math.abs(y - Math.round(y)) > 0.3) return Math.floor(y) + '年半後';
    return Math.round(y) + '年後';
  }

  /* =========================================================
     シナリオの登録
     ========================================================= */
  OSC.scenarios = OSC.scenarios || [];

  function prepare(scn) {
    scn.vars = scn.vars || {};
    scn._index = {};
    scn.events.forEach(function (ev, i) {
      ev._order = i;
      ev.scope = ev.scope || DEFAULT_SCOPE[ev.impactCategory] || 3;
      ev.nextEvents = ev.nextEvents || [];
      ev._cond = compileCondition(ev.conditions);
      scn._index[ev.eventId] = ev;
    });
    scn.decisions.forEach(function (d) {
      d._cond = compileCondition(d.conditions);
      d.options.forEach(function (o) { o.next = o.next || []; });
    });
    scn.futures.forEach(function (f) { f._cond = compileCondition(f.conditions); });
    return scn;
  }

  OSC.registerScenario = function (scn) {
    try {
      prepare(scn);
      var problems = validate(scn);
      if (problems.length && root.console) root.console.warn('[ONE SMALL CHOICE] ' + scn.id + ': ' + problems.join(' / '));
      OSC.scenarios.push(scn);
      OSC.scenarios.sort(function (a, b) { return a.number < b.number ? -1 : 1; });
    } catch (e) {
      if (root.console) root.console.warn('[ONE SMALL CHOICE] シナリオを登録できません: ' + (scn && scn.id), e);
    }
  };

  OSC.getScenario = function (id) {
    for (var i = 0; i < OSC.scenarios.length; i++) if (OSC.scenarios[i].id === id) return OSC.scenarios[i];
    return null;
  };

  /* ---------- データの検証（テストでも使う） ---------- */
  function validate(scn) {
    var p = [];
    var idx = scn._index;
    ['id', 'number', 'title', 'decisions', 'events', 'futures'].forEach(function (k) { if (!scn[k]) p.push('項目がありません: ' + k); });
    scn.events.forEach(function (ev) {
      if (!CATEGORIES[ev.impactCategory]) p.push(ev.eventId + ': impactCategory が不正');
      ev.nextEvents.forEach(function (n) {
        if (!idx[n]) p.push(ev.eventId + ' → ' + n + ' が存在しない');
        else if (idx[n].time < ev.time) p.push(ev.eventId + ' → ' + n + ' が過去に戻っている');
      });
    });
    scn.decisions.forEach(function (d) {
      d.options.forEach(function (o) {
        o.next.forEach(function (n) {
          if (!idx[n]) p.push(d.id + '/' + o.id + ' → ' + n + ' が存在しない');
          else if (idx[n].time < d.time) p.push(d.id + '/' + o.id + ' → ' + n + ' が過去に戻っている');
        });
      });
    });
    if (!scn.futures.length || scn.futures[scn.futures.length - 1].conditions) p.push('最後の未来は条件なし（予備）にしてください');
    return p;
  }

  /* =========================================================
     シミュレーション本体
     run(scenario, answers, { auto })
       answers: { d1: 'B', d2b: 'A', ... }
       auto:    未回答の選択を自動で決める（比較用の未来計算）
     戻り値:
       steps    … 起きた出来事と選択（時系列）
       pending  … まだ答えていない選択（あれば）
       future   … 最終的な未来（pending が無いとき）
     ========================================================= */
  function run(scn, answers, opts) {
    answers = answers || {};
    opts = opts || {};
    var st = {
      vars: Object.assign({}, BASE_VARS, scn.vars),
      flags: new Set(),
      fired: new Set(),
      answers: {}
    };
    var steps = [];
    var stepById = {};
    var pool = new Map();
    var rejected = new Set();
    var resolved = new Set();
    var decisions = scn.decisions.slice().sort(function (a, b) { return a.time - b.time; });
    var pending = null;
    var guard = 0;

    function enqueue(ids, parentId) {
      ids.forEach(function (id) {
        var ev = scn._index[id];
        if (!ev || st.fired.has(id) || rejected.has(id)) return;
        var c = pool.get(id);
        if (c) { if (c.parents.indexOf(parentId) < 0) c.parents.push(parentId); }
        else pool.set(id, { ev: ev, parents: [parentId] });
      });
    }
    function nextCandidate() {
      var best = null;
      pool.forEach(function (c) {
        if (!best || c.ev.time < best.ev.time || (c.ev.time === best.ev.time && c.ev._order < best.ev._order)) best = c;
      });
      return best;
    }
    function push(step) { steps.push(step); stepById[step.id] = step; }

    while (guard++ < 2000) {
      var cand = nextCandidate();
      var candTime = cand ? cand.ev.time : Infinity;

      /* 1) この時点までに来る「あなたの選択」 */
      var due = null;
      for (var k = 0; k < decisions.length; k++) {
        var d = decisions[k];
        if (resolved.has(d.id)) continue;
        if (d.time > candTime) break;
        if (!d._cond(st)) { resolved.add(d.id); continue; }
        due = d; break;
      }
      if (due) {
        var opt = null;
        for (var j = 0; j < due.options.length; j++) if (due.options[j].id === answers[due.id]) opt = due.options[j];
        if (!opt && opts.auto) {
          opt = due.options.filter(function (o) { return o['default']; })[0] || due.options[0];
        }
        if (!opt) { pending = due; break; }
        resolved.add(due.id);
        st.answers[due.id] = opt.id;
        applyEffects(opt.effects, st);
        var prev = steps.length ? [steps[steps.length - 1].id] : [];
        push({ type: 'decision', id: due.id, time: due.time, decision: due, option: opt, parents: prev, scope: 1, category: 'PERSONAL' });
        enqueue(opt.next, due.id);
        continue;
      }

      /* 2) 次に起こりうる出来事 */
      if (!cand) break;
      pool.delete(cand.ev.eventId);
      if (cand.ev._cond(st)) {
        applyEffects(cand.ev.effects, st);
        st.fired.add(cand.ev.eventId);
        push({
          type: 'event', id: cand.ev.eventId, time: cand.ev.time, event: cand.ev,
          parents: cand.parents.filter(function (pid) { return stepById[pid]; }),
          scope: cand.ev.scope, category: cand.ev.impactCategory
        });
        enqueue(cand.ev.nextEvents, cand.ev.eventId);
      } else {
        rejected.add(cand.ev.eventId);
      }
    }

    var result = { scenario: scn, steps: steps, state: st, pending: pending, answers: Object.assign({}, st.answers) };
    if (!pending) {
      var fut = null;
      for (var f = 0; f < scn.futures.length; f++) if (scn.futures[f]._cond(st)) { fut = scn.futures[f]; break; }
      result.future = fut || scn.futures[scn.futures.length - 1];
      var maxT = steps.reduce(function (m, s) { return Math.max(m, s.time); }, 0);
      result.years = Math.max(1, Math.round(maxT / 365));
      result.metrics = metrics(st, result.years);
      result.year = (scn.baseYear || 2026) + result.years;
      result.chain = chain(steps, stepById);
    }
    return result;
  }

  /* 架空のシミュレーション値（0〜100）
     ・50 が物語の始まりの水準
     ・何もしなくても環境は少しずつ悪くなる（年 0.3 ずつ）という前提を置く */
  function metrics(st, years) {
    years = years || 0;
    function c(v) { return Math.max(3, Math.min(98, Math.round(50 + (v - 50) * 2.2))); }
    var v = st.vars;
    var env = v.environment - years * 0.3;
    var m = { society: c(v.society), economy: c(v.economy), environment: c(env), life: c(v.life) };
    m.planet = c(env * 0.55 + (v.society + v.economy + v.life) / 3 * 0.45);
    return m;
  }

  /* 最初の選択から最後の出来事までの因果のつながりをたどる */
  function chain(steps, stepById) {
    var last = null;
    for (var i = steps.length - 1; i >= 0; i--) {
      if (steps[i].type === 'event' && steps[i].scope >= 5) { last = steps[i]; break; }
    }
    if (!last) last = steps[steps.length - 1];
    var out = [];
    var cur = last;
    var seen = {};
    while (cur && !seen[cur.id]) {
      seen[cur.id] = 1;
      out.unshift(cur);
      cur = cur.parents && cur.parents.length ? stepById[cur.parents[0]] : null;
    }
    return out;
  }

  /* 選ばなかった最初の選択肢ごとの未来（比較用） */
  function alternatives(scn, answers) {
    var d1 = scn.decisions[0];
    return d1.options.filter(function (o) { return o.id !== answers[d1.id]; }).map(function (o) {
      var a = Object.assign({}, answers); a[d1.id] = o.id;
      var r = run(scn, a, { auto: true });
      r.firstOption = o;
      return r;
    });
  }

  /* 全組み合わせを列挙（テスト・図鑑用） */
  function enumerate(scn) {
    var results = [];
    function walk(ans) {
      var r = run(scn, ans);
      if (!r.pending) { results.push(r); return; }
      r.pending.options.forEach(function (o) {
        var a = Object.assign({}, ans); a[r.pending.id] = o.id; walk(a);
      });
    }
    walk({});
    return results;
  }

  OSC.engine = {
    CATEGORIES: CATEGORIES, SCOPES: SCOPES, BASE_VARS: BASE_VARS,
    compileCondition: compileCondition, run: run, alternatives: alternatives,
    enumerate: enumerate, validate: validate, formatTime: formatTime, metrics: metrics
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = OSC;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   ONE SMALL CHOICE — 記録の保存（LocalStorage）
   ・発見した未来、プレイ履歴、設定、途中の進行状況
   ・保存できない環境（プライベートモード等）でも遊べるようにする
   ========================================================= */
(function (root) {
  'use strict';
  var OSC = (root.OSC = root.OSC || {});
  var KEY = 'one-small-choice.v1';
  var data = load();

  function blank() {
    return { settings: { speed: 'normal' }, discovered: {}, played: {}, history: [], session: null, seenHowto: false };
  }
  function load() {
    try {
      var raw = root.localStorage && root.localStorage.getItem(KEY);
      if (!raw) return blank();
      var d = JSON.parse(raw);
      var b = blank();
      Object.keys(b).forEach(function (k) { if (d[k] === undefined) d[k] = b[k]; });
      return d;
    } catch (e) { return blank(); }
  }
  function save() {
    try { root.localStorage && root.localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 保存できなくても続行 */ }
  }

  OSC.store = {
    get settings() { return data.settings; },
    setSetting: function (k, v) { data.settings[k] = v; save(); },

    discovered: function (scnId) { return data.discovered[scnId] || []; },
    playedCount: function (scnId) { return data.played[scnId] || 0; },
    totalDiscovered: function () {
      return Object.keys(data.discovered).reduce(function (n, k) { return n + data.discovered[k].length; }, 0);
    },
    /* 未来に到達したときに1回だけ呼ぶ */
    recordFuture: function (scn, result) {
      var list = data.discovered[scn.id] || (data.discovered[scn.id] = []);
      var isNew = list.indexOf(result.future.id) < 0;
      if (isNew) list.push(result.future.id);
      data.played[scn.id] = (data.played[scn.id] || 0) + 1;
      data.history.unshift({
        scenarioId: scn.id, futureId: result.future.id, futureTitle: result.future.title,
        first: result.steps[0] && result.steps[0].option ? result.steps[0].option.label : '',
        answers: result.answers, year: result.year, at: Date.now()
      });
      data.history = data.history.slice(0, 30);
      save();
      return isNew;
    },
    history: function () { return data.history; },
    /* 選択肢ごとに、すでに選んだことがあるか */
    triedFirst: function (scnId) {
      var s = {};
      data.history.forEach(function (h) { if (h.scenarioId === scnId && h.answers) s[h.answers.d1] = (s[h.answers.d1] || 0) + 1; });
      return s;
    },

    /* 途中経過（リロードしても続きから） */
    get session() { return data.session; },
    setSession: function (s) { data.session = s; save(); },
    clearSession: function () { data.session = null; save(); },

    get seenHowto() { return data.seenHowto; },
    markHowto: function () { data.seenHowto = true; save(); },

    reset: function () { data = blank(); save(); }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  /* ---------- アイコン ---------- */
  var ICONS = {

    SOCIAL: '<circle cx="9" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M3 19c.8-3.4 3.2-5 6-5s5.2 1.6 6 5"/><path d="M15.5 14.2c2.6-.3 4.7 1 5.5 4.3"/>',
    ECONOMY: '<path d="M4 20h16"/><path d="M6 17v-4"/><path d="M10.5 17V9"/><path d="M15 17v-6"/><path d="M19.5 17V5"/>',

    TECHNOLOGY: '<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>',

  function P(i, inner, extra) { return '<g class="ill-part' + (extra ? ' ' + extra : '') + '" style="--i:' + i + '">' + inner + '</g>'; }
  function person(x, y, s, cls) {

   因果関係を線でつないでいく
   ========================================================= */
(function (root) {
  'use strict';
  var OSC = root.OSC;
  var ui = OSC.ui, E = OSC.engine;
  var SVGNS = 'http://www.w3.org/2000/svg';
  var SPEEDS = { slow: { base: 2300, per: 80 }, normal: { base: 1400, per: 50 }, fast: { base: 650, per: 22 } };
  var LANES = [14, 29, 44];

  function svgEl(name, attrs) {
    var n = document.createElementNS(SVGNS, name);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }

  var Sim = {
    init: function (hooks) {
      var self = this;
      this.hooks = hooks;
      this.scroller = ui.$('#sim-scroll');
      this.tl = ui.$('#timeline');
      this.svg = ui.$('#links');
      this.dock = ui.$('#sim-dock');
      this.sheet = ui.$('#sheet');
      this.veil = ui.$('#sheet-veil');
      this.wait = ui.$('#sim-wait');
      this.endSlot = ui.$('#sim-end-slot');

      /* 画面をタップすると次の出来事へ */
      this.scroller.addEventListener('click', function (e) {
        if (e.target.closest('button')) return;
        if (self.done || self.sheetOpen || !self.active) return;
        clearTimeout(self.timer);
        self.advance();
      });
      this.dock.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.speed) { OSC.store.setSetting('speed', b.dataset.speed); self.renderDock(); }
        if (b.dataset.act === 'skip') self.skip();
        if (b.dataset.act === 'future') self.hooks.onFuture(self.result);
      });
      this.sheet.addEventListener('click', function (e) {
        var b = e.target.closest('.option');
        if (!b || self.answering) return;
        self.choose(b.dataset.opt, b);
      });
      var rt;
      root.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (self.active) self.redraw(); }, 150); });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (self.active) self.redraw(); });
    },

    start: function (scn, answers, restore) {
      this.stop();
      this.scn = scn;
      this.answers = answers;
      this.shown = 0;
      this.maxScope = 0;
      this.nodes = {};
      this.order = [];
      this.childCount = {};
      this.done = false;
      this.active = true;
      this.answering = false;
      this.tl.querySelectorAll('.step, .scope-divider').forEach(function (n) { n.remove(); });
      this.svg.innerHTML = '';
      this.gLinks = svgEl('g'); this.gNodes = svgEl('g');
      this.svg.appendChild(this.gLinks); this.svg.appendChild(this.gNodes);
      this.endSlot.innerHTML = '';
      this.closeSheet();
      ui.$('#sim-title').innerHTML = '<b>' + ui.esc(scn.number) + '</b>' + ui.esc(scn.title);
      this.renderMeter();
      this.updateClock(0);
      this.renderDock();
      this.scroller.scrollTop = 0;
      this.result = E.run(scn, answers);
      if (restore) { this.revealAll(); }
      else { this.setWaiting(true); this.schedule(700); }
    },

    stop: function () { clearTimeout(this.timer); this.active = false; },

    schedule: function (ms) {
      var self = this;
      clearTimeout(this.timer);
      this.timer = setTimeout(function () { self.advance(); }, ms);
    },

    delayFor: function (step) {
      var sp = SPEEDS[OSC.store.settings.speed] || SPEEDS.normal;
      var text = step.type === 'event' ? step.event.title + step.event.description : step.option.label;
      return sp.base + text.length * sp.per;
    },

    advance: function () {
      if (!this.active || this.sheetOpen) return;
      if (this.shown < this.result.steps.length) {
        var step = this.result.steps[this.shown++];
        this.renderStep(step, true);
        if (this.shown < this.result.steps.length) this.schedule(this.delayFor(step));
        else this.schedule(Math.min(this.delayFor(step), 2600));
      } else {
        this.reachEnd();
      }
    },

    revealAll: function () {
      clearTimeout(this.timer);
      while (this.shown < this.result.steps.length) this.renderStep(this.result.steps[this.shown++], false);
      this.redraw();
      this.scroller.scrollTop = this.scroller.scrollHeight;
      this.reachEnd();
    },

    skip: function () {
      if (this.done || this.sheetOpen) return;
      this.revealAll();
    },

    reachEnd: function () {
      clearTimeout(this.timer);
      if (this.result.pending) this.openSheet(this.result.pending);
      else this.finish();
    },

    /* ---------- 1つの出来事を表示 ---------- */
    assignLane: function (step) {
      var self = this;
      var ps = step.parents.filter(function (p) { return self.nodes[p]; });
      var lane = 1;
      if (ps.length > 1) {
        lane = Math.round(ps.reduce(function (s, p) { return s + self.nodes[p].lane; }, 0) / ps.length);
      } else if (ps.length === 1) {
        var p = ps[0];
        var k = this.childCount[p] || 0;
        this.childCount[p] = k + 1;
        var base = this.nodes[p].lane;
        var offs = [0, 1, -1, 2, -2][k] || 0;
        lane = base + offs;
        if (lane > 2) lane = base - 1;
        if (lane < 0) lane = base + 1;
        lane = Math.max(0, Math.min(2, lane));
      }
      return lane;
    },

    cardHtml: function (step) {
      var cat = step.category;
      var C = E.CATEGORIES[cat];
      var time = E.formatTime(step.time);
      if (step.type === 'decision') {
        var d = step.decision;
        return '<article class="step you" style="--cat:var(--c-PERSONAL)">' +
          '<div class="step-meta"><span class="step-time">' + time + '</span>' +
          '<span class="step-cat">' + OSC.art.icon('hand') + 'YOUR CHOICE</span>' +
          '<span class="step-scope">あなたの選択</span></div>' +
          (d.context ? '<p class="step-desc">' + ui.esc(d.context) + '</p>' : '') +
          '<h3 class="step-title">「' + ui.esc(step.option.label) + '」</h3></article>';
      }
      var ev = step.event;
      var merge = step.parents.length > 1 ? '<div class="step-merge">' + step.parents.length + 'つの流れが合流</div>' : '';
      return '<article class="step' + (step.scope >= 5 ? ' big' : '') + '" style="--cat:var(--c-' + cat + ')">' +
        '<div class="step-meta"><span class="step-time">' + time + '</span>' +
        '<span class="step-cat">' + OSC.art.icon(cat) + C.en + ' · ' + C.ja + '</span>' +
        '<span class="step-scope">' + E.SCOPES[step.scope] + '</span></div>' +
        '<h3 class="step-title">' + ui.esc(ev.title) + '</h3>' +
        '<p class="step-desc">' + ui.esc(ev.description) + '</p>' + merge + '</article>';
    },

    renderStep: function (step, animate) {
      var lane = this.assignLane(step);
      if (step.type === 'event' && step.scope > this.maxScope) {
        if (this.maxScope > 0 && step.scope >= 2) {
          var div = ui.el('<div class="scope-divider">影響が<b>' + E.SCOPES[step.scope] + '</b>へ広がった</div>');
          this.tl.appendChild(div);
        }
        this.maxScope = step.scope;
        this.renderMeter(animate);
      } else if (this.maxScope === 0) {
        this.maxScope = 1; this.renderMeter(false);
      }
      var card = ui.el(this.cardHtml(step));
      if (!animate) card.classList.add('instant');
      this.tl.appendChild(card);
      this.nodes[step.id] = { lane: lane, card: card, step: step };
      this.order.push(step.id);
      this.updateClock(step.time);
      if (animate) {
        this.svg.setAttribute('height', this.tl.scrollHeight);
        this.drawNode(step, true);
        this.scrollTo(card);
      }
    },

    pos: function (id) {
      var n = this.nodes[id];
      return { x: LANES[n.lane], y: n.card.offsetTop + 24 };
    },

    drawNode: function (step, animate) {
      var self = this;
      var b = this.pos(step.id);
      var color = 'var(--c-' + step.category + ')';
      step.parents.forEach(function (pid) {
        if (!self.nodes[pid]) return;
        var a = self.pos(pid);
        var dy = b.y - a.y;
        var path = svgEl('path', {
          d: 'M' + a.x + ' ' + a.y + ' C' + a.x + ' ' + (a.y + dy * 0.55) + ' ' + b.x + ' ' + (b.y - dy * 0.45) + ' ' + b.x + ' ' + b.y
        });
        path.style.stroke = color;
        self.gLinks.appendChild(path);
        OSC.anim.drawPath(path, animate);
      });
      var isDec = step.type === 'decision';
      var r = isDec ? 4.5 : (2.2 + step.scope * 0.9);
      if (animate && step.scope >= 3 && !isDec) {
        var halo = svgEl('circle', { cx: b.x, cy: b.y, r: 4, 'class': 'halo go' });
        halo.style.stroke = color;
        this.gNodes.appendChild(halo);
        setTimeout(function () { halo.remove(); }, 1500);
      }
      var c = svgEl('circle', { cx: b.x, cy: b.y, r: r, 'class': isDec ? 'dec' : '' });
      if (!isDec) c.style.fill = color;
      this.gNodes.appendChild(c);
    },

    redraw: function () {
      var self = this;
      this.gLinks.innerHTML = ''; this.gNodes.innerHTML = '';
      this.svg.setAttribute('height', this.tl.scrollHeight);
      this.order.forEach(function (id) { self.drawNode(self.nodes[id].step, false); });
    },

    scrollTo: function (card) {
      var sc = this.scroller;
      var r = card.getBoundingClientRect();
      var sr = sc.getBoundingClientRect();
      var overflow = r.bottom - (sr.bottom - 130);
      var maxUp = r.top - sr.top - 12;
      var delta = Math.min(overflow, maxUp);
      if (delta > 0) sc.scrollTop = sc.scrollTop + delta;
    },

    /* ---------- 上部：時間と影響の広がり ---------- */
    updateClock: function (t) {
      var when = ui.$('#sim-when');
      var label = E.formatTime(t);
      if (when.textContent !== label) {
        when.style.opacity = 0;
        setTimeout(function () { when.textContent = label; when.style.opacity = 1; }, 160);
      }
      ui.$('#sim-year').textContent = ((this.scn.baseYear || 2026) + Math.round(t / 365)) + '年';
    },

    renderMeter: function (pulse) {
      var m = this.maxScope;
      ui.$('#scope-meter').innerHTML = [1, 2, 3, 4, 5].map(function (s) {
        var cls = s < m ? 'on' : (s === m ? 'now' + (pulse ? ' pulse' : '') : '');
        return '<div class="' + cls + '"><i></i><span>' + E.SCOPES[s] + '</span></div>';
      }).join('');
    },

    renderDock: function () {
      if (this.done) {
        this.dock.innerHTML = '<button class="btn block" data-act="future">' + this.result.years + '年後の地球を見る' + OSC.art.icon('arrow') + '</button>';
        return;
      }
      var sp = OSC.store.settings.speed || 'normal';
      var opts = [['slow', '0.5×', 'ゆっくり'], ['normal', '1×', 'ふつう'], ['fast', '2×', 'はやい']];
      this.dock.innerHTML =
        '<div class="speed-group" role="group" aria-label="表示の速さ">' + opts.map(function (o) {
          return '<button data-speed="' + o[0] + '" aria-pressed="' + (sp === o[0]) + '" aria-label="' + o[2] + '">' + o[1] + '</button>';
        }).join('') + '</div>' +
        '<span class="hint">タップで次へ</span>' +
        '<button class="skip-btn" data-act="skip">SKIP' + OSC.art.icon('skip') + '</button>';
    },

    setWaiting: function (on) { this.wait.hidden = !on; },

    /* ---------- 途中の「あなたの選択」 ---------- */
    openSheet: function (d) {
      var n = this.result.steps.filter(function (s) { return s.type === 'decision'; }).length + 1;
      this.setWaiting(false);
      ui.$('#sheet-body').innerHTML =
        '<div class="grab"></div>' +
        '<div class="eyebrow">YOUR CHOICE <span class="num">· ' + n + '</span> ／ ' + E.formatTime(d.time) + '</div>' +
        (d.context ? '<p class="ctx">' + ui.esc(d.context) + '</p>' : '') +
        '<h2 id="sheet-title" tabindex="-1">' + ui.esc(d.prompt) + '</h2>' +
        '<div class="options">' + d.options.map(function (o, i) {
          return '<button class="option" data-opt="' + o.id + '" style="--i:' + i + '">' +
            '<span class="key">' + o.id + '</span><span class="lbl"><b>' + ui.esc(o.label) + '</b>' +
            (o.note ? '<small>' + ui.esc(o.note) + '</small>' : '') + '</span></button>';
        }).join('') + '</div>';
      this.pendingDecision = d;
      this.sheetOpen = true;
      this.answering = false;
      var sheet = this.sheet, veil = this.veil;
      requestAnimationFrame(function () { sheet.classList.add('open'); veil.classList.add('open'); });
      this.updateClock(d.time);
      /* 選択肢に偏りが出ないよう、フォーカスは問いかけの見出しに置く */
      setTimeout(function () { var t = sheet.querySelector('#sheet-title'); if (t) t.focus({ preventScroll: true }); }, 500);
    },

    closeSheet: function () {
      this.sheet.classList.remove('open');
      this.veil.classList.remove('open');
      this.sheetOpen = false;
    },

    choose: function (optId, btn) {
      var self = this;
      var d = this.pendingDecision;
      this.answering = true;
      btn.classList.add('is-picked');
      btn.parentNode.classList.add('is-done');
      this.answers[d.id] = optId;
      this.hooks.onAnswer(this.answers);
      setTimeout(function () {
        self.closeSheet();
        self.result = E.run(self.scn, self.answers);
        self.setWaiting(true);
        self.schedule(450);
      }, 520);
    },

    /* ---------- おわり ---------- */
    finish: function () {
      this.done = true;
      this.setWaiting(false);
      this.endSlot.innerHTML =
        '<div class="sim-end"><div class="mini-globe">' + OSC.art.globe({ cls: 'fast' }) + '</div>' +
        '<p>' + this.result.years + '年後。小さな選択から始まった流れは、地球全体に届いた。</p></div>';
      this.renderDock();
      var sc = this.scroller;
      setTimeout(function () { sc.scrollTop = sc.scrollHeight; }, 60);
      this.hooks.onDone && this.hooks.onDone(this.result);
    }
  };

  OSC.Sim = Sim;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   ONE SMALL CHOICE — 画面管理と各画面の描画
   HOME → SCENARIO → CHOICE → SIMULATION → FUTURE → COMPARISON
   ========================================================= */
(function (root) {
  'use strict';
  var OSC = root.OSC;
  var ui = OSC.ui, E = OSC.engine, store = OSC.store, art = OSC.art, esc = ui.esc;

  var S = { scn: null, answers: {}, result: null, alts: null, altIndex: 0, another: false, lastFirst: null, recorded: false, from: 'home' };
  var STEP_SCREENS = { scenario: 1, choice: 1, sim: 1, future: 1, compare: 1 };
  var ASPECTS = [
    ['society', '社会', 'SOCIETY'], ['economy', '経済', 'ECONOMY'], ['environment', '環境', 'ENVIRONMENT'],
    ['life', '人々の生活', 'LIFE'], ['planet', '地球の状態', 'PLANET']
  ];
  var current = null;

  /* ---------- 画面の切り替え（フェード） ---------- */
  function show(name) {
    var next = ui.$('#screen-' + name);
    if (name !== 'sim') OSC.Sim.stop();
    if (current && current !== next) current.classList.remove('is-active');
    next.scrollTop = 0;
    var tb = next.querySelector('.topbar');
    if (tb) tb.classList.remove('is-scrolled');
    void next.offsetWidth;
    next.classList.add('is-active');
    current = next;
    if (S.scn && STEP_SCREENS[name]) {
      store.setSession({ scenarioId: S.scn.id, answers: S.answers, screen: name, recorded: S.recorded, another: S.another, lastFirst: S.lastFirst });
    }
  }

  function setTitles() {
    var t = S.scn ? '<b>' + esc(S.scn.number) + '</b>' + esc(S.scn.title) : '';
    ui.$$('[data-title]').forEach(function (n) { n.innerHTML = t; });
  }

  function totalFutures(scn) { return scn.futures.filter(function (f) { return f.id !== 'default'; }).length; }
  function allFutures() { return OSC.scenarios.reduce(function (n, s) { return n + totalFutures(s); }, 0); }

  /* =========================================================
     ① HOME
     ========================================================= */
  function renderHome() {
    var g = ui.$('#home-globe');
    if (!g.firstChild) g.innerHTML = art.globe({ orbit: true });
    var found = store.totalDiscovered();
    ui.$('#home-record').textContent = found ? '発見した未来　' + found + ' / ' + allFutures() : OSC.scenarios.length + ' SCENARIOS · ' + allFutures() + ' FUTURES';
    var ses = store.session;
    var c = ui.$('#btn-continue');
    var scn = ses && OSC.getScenario(ses.scenarioId);
    if (scn && STEP_SCREENS[ses.screen] && ses.screen !== 'scenario') {
      c.hidden = false;
      c.textContent = 'CONTINUE · ' + scn.number;
    } else c.hidden = true;
  }

  function nextUnplayed() {
    for (var i = 0; i < OSC.scenarios.length; i++) if (!store.playedCount(OSC.scenarios[i].id)) return OSC.scenarios[i];
    return OSC.scenarios[0];
  }

  /* =========================================================
     SCENARIO COLLECTION
     ========================================================= */
  function renderCollection() {
    var found = store.totalDiscovered(), total = allFutures();
    var cards = OSC.scenarios.map(function (s) {
      var got = store.discovered(s.id);
      var dots = s.futures.filter(function (f) { return f.id !== 'default'; }).map(function (f) {
        return '<i class="' + (got.indexOf(f.id) >= 0 ? 'on' : '') + '"></i>';
      }).join('');
      var played = store.playedCount(s.id);
      return '<button class="scn-card" data-act="open-scenario" data-id="' + s.id + '">' +
        '<span class="scn-thumb">' + art.illustration(s.illustration, 'ill-static') + '</span>' +
        '<span class="scn-body"><span class="num">' + esc(s.number) + '</span><h3>' + esc(s.title) + '</h3><span class="theme">' + esc(s.theme) + '</span></span>' +
        (played ? '<span class="scn-dots" aria-label="発見した未来 ' + got.length + '/' + totalFutures(s) + '">' + dots + '</span>' : '<span class="scn-new">NEW</span>') +
        '</button>';
    }).join('');
    var hist = store.history().slice(0, 6).map(function (h) {
      var s = OSC.getScenario(h.scenarioId);
      if (!s) return '';
      return '<li><span class="y">' + h.year + '</span><span class="t"><b>' + esc(s.number + ' ' + s.title) + '</b>　「' + esc(h.first) + '」→ ' + esc(h.futureTitle) + '</span></li>';
    }).join('');
    ui.$('#collection-body').innerHTML =
      '<div class="page-head"><div class="eyebrow">Collection</div><h1>SCENARIOS</h1>' +
      '<p>8つの日常のひとコマ。選び方しだいで、たどり着く未来が変わります。</p>' +
      '<div class="found-bar"><span>発見した未来</span><span class="track"><i style="width:' + (total ? found / total * 100 : 0) + '%"></i></span><span>' + found + ' / ' + total + '</span></div></div>' +
      '<div class="scn-list">' + cards + '</div>' +
      (hist ? '<div class="history"><h2>RECENT FUTURES</h2><ol>' + hist + '</ol></div>' : '');
  }

  /* =========================================================
     ② SCENARIO
     ========================================================= */
  function openScenario(id, from) {
    S.scn = OSC.getScenario(id);
    S.answers = {}; S.result = null; S.alts = null; S.another = false; S.lastFirst = null; S.recorded = false;
    if (from) S.from = from;
    renderScenario();
    show('scenario');
  }

  function renderScenario() {
    var s = S.scn;
    setTitles();
    ui.$('#scenario-body').innerHTML =
      '<div class="scn-intro">' +
      '<div class="eyebrow">Scenario <span class="num">' + esc(s.number) + '</span></div>' +
      '<h1>' + esc(s.title) + '</h1>' +
      '<div class="chips">' + s.theme.split('・').map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div>' +
      '<div class="illus">' + art.illustration(s.illustration) + '</div>' +
      '<div class="intro-lines">' + s.intro.map(function (l, i) { return '<span style="--i:' + i + '">' + esc(l) + '</span>'; }).join('') + '</div>' +
      '<p class="setting">' + esc(s.setting) + '</p>' +
      '<button class="btn block" data-act="to-choice">NEXT' + art.icon('arrow') + '</button>' +
      '</div>';
  }

  /* =========================================================
     ③ CHOICE
     ========================================================= */
  function renderChoice() {
    var s = S.scn, d = s.decisions[0];
    var tried = store.triedFirst(s.id);
    setTitles();
    ui.$('#choice-body').innerHTML =
      '<div class="choice-head">' +
      '<div class="eyebrow">Choice <span class="num">· 1</span></div>' +
      '<p class="ctx">' + esc(s.intro.join('')) + '</p>' +
      '<h1>' + esc(d.prompt) + '</h1>' +
      (S.another ? '<p class="choice-note">最初の選択を変えると、その先の因果はすべて計算し直されます。</p>' : '') +
      '</div>' +
      '<div class="options" id="first-options">' + d.options.map(function (o, i) {
        var tag = S.another && S.lastFirst === o.id ? '前回の選択' : (tried[o.id] ? '体験済み' : '');
        return '<button class="option" data-act="pick-first" data-opt="' + o.id + '" style="--i:' + i + '">' +
          '<span class="key">' + o.id + '</span><span class="lbl"><b>' + esc(o.label) + '</b>' +
          (o.note ? '<small>' + esc(o.note) + '</small>' : '') + '</span>' +
          (tag ? '<span class="seen">' + tag + '</span>' : '') + '</button>';
      }).join('') + '</div>';
  }

  function pickFirst(btn) {
    var box = ui.$('#first-options');
    if (box.classList.contains('is-done')) return;
    btn.classList.add('is-picked');
    box.classList.add('is-done');
    S.answers = { d1: btn.dataset.opt };
    S.result = null; S.alts = null; S.recorded = false;
    setTimeout(function () { startSim(false); }, 700);
  }

  /* =========================================================
     ④ SIMULATION
     ========================================================= */
  function startSim(restore) {
    setTitles();
    show('sim');
    OSC.Sim.start(S.scn, S.answers, restore);
  }

  /* =========================================================
     ⑤ FUTURE
     ========================================================= */
  function openFuture() {
    var r = S.result || E.run(S.scn, S.answers);
    if (r.pending) { startSim(true); return; }
    S.result = r;
    S.alts = null;
    var isNew = false;
    if (!S.recorded) { isNew = store.recordFuture(S.scn, r); S.recorded = true; }
    renderFuture(r);
    show('future');
    var body = ui.$('#future-body');
    setTimeout(function () { var g = body.querySelector('.globe'); if (g) g.classList.add('spreading'); }, 450);
    OSC.anim.fillMeters(body, 900);
    if (isNew) {
      var n = store.discovered(S.scn.id).length;
      setTimeout(function () { ui.toast('新しい未来を発見しました　' + n + ' / ' + totalFutures(S.scn)); }, 1600);
    }
  }

  function chainItemText(step) {
    if (step.type === 'decision') return 'あなたは「' + step.option.label + '」を選んだ';
    return step.event.title;
  }

  function renderFuture(r) {
    var f = r.future, m = r.metrics, s = S.scn;
    var first = r.steps[0] && r.steps[0].option;
    var body = ui.$('#future-body');
    body.className = 'wrap tone-' + (f.tone || 'blue');
    setTitles();
    var aspects = ASPECTS.slice(0, 4).map(function (a) {
      return '<div class="aspect"><div class="h"><b>' + a[1] + '</b><span>' + m[a[0]] + '</span></div>' +
        '<div class="meter"><i data-w="' + m[a[0]] + '"></i></div>' +
        '<p>' + esc(f[a[0]]) + '</p></div>';
    }).join('');
    var recap = r.chain.map(function (st) {
      var cls = st.type === 'decision' ? ' class="you"' : ' style="--cat:var(--c-' + st.category + ')"';
      return '<li' + cls + '><span class="t">' + E.formatTime(st.time) + '</span><span class="x">' + esc(chainItemText(st)) + '</span></li>';
    }).join('');
    body.innerHTML =
      '<div class="future-hero">' +
        '<div class="eyebrow">Future <span class="num">· ' + r.years + '年後</span></div>' +
        '<div class="future-globe">' + art.globe({ spread: true }) + '</div>' +
        '<div class="year-big">' + r.year + '</div>' +
        '<h1>' + esc(f.title) + '</h1>' +
        '<p class="summary">' + esc(f.summary) + '</p>' +
      '</div>' +
      '<div class="span-line"><div class="end"><b>' + (s.baseYear || 2026) + '</b><span>' + esc(first ? first.label : '') + '</span></div>' +
        '<div class="bar"></div><div class="end r"><b>' + r.year + '</b><span>' + esc(f.title) + '</span></div></div>' +
      '<p class="twist">' + esc(f.twist) + '</p>' +
      '<section class="sec"><div class="sec-h"><h2>World Events</h2><span>世界で起こったこと</span></div><ul class="impacts">' +
        f.impacts.map(function (im) {
          return '<li style="--cat:var(--c-' + im.cat + ')"><span class="k">' + E.CATEGORIES[im.cat].ja + '</span><span>' + esc(im.text) + '</span></li>';
        }).join('') + '</ul></section>' +
      '<section class="sec"><div class="sec-h"><h2>Impact</h2><span>社会・経済・環境・生活</span></div>' +
        '<div class="aspects">' + aspects + '</div>' +
        '<p class="note">※ 数値はゲーム内の架空のシミュレーション値です（50 = 物語が始まった' + (s.baseYear || 2026) + '年の水準）。</p></section>' +
      '<section class="sec"><div class="sec-h"><h2>Causal Chain</h2><span>因果の振り返り</span></div><ol class="recap">' + recap + '</ol></section>' +
      '<div class="future-cta"><button class="btn block" data-act="compare">選ばなかった未来と比べる' + art.icon('arrow') + '</button></div>';
  }

  /* =========================================================
     ⑥ COMPARISON
     ========================================================= */
  function openCompare() {
    if (!S.result) S.result = E.run(S.scn, S.answers);
    if (S.result.pending) { startSim(true); return; }
    if (!S.alts) { S.alts = E.alternatives(S.scn, S.answers); S.altIndex = 0; }
    renderCompare();
    show('compare');
  }

  function renderCompare() {
    var first = S.result.steps[0].option;
    setTitles();
    ui.$('#compare-body').innerHTML =
      '<div class="cmp-head"><div class="eyebrow">Comparison</div><h1>選ばなかった未来</h1>' +
      '<p class="muted">最初の選択だけを変えて、因果関係をもう一度計算しました。あなたは「' + esc(first.label) + '」を選びました。</p></div>' +
      '<div class="cmp-tabs" role="tablist">' + S.alts.map(function (a, i) {
        return '<button class="cmp-tab" role="tab" data-act="alt" data-i="' + i + '" aria-selected="' + (i === S.altIndex) + '">もし「' + esc(a.firstOption.label) + '」なら</button>';
      }).join('') + '</div>' +
      '<div id="cmp-slot"></div>' +
      '<div class="cmp-actions">' +
        '<button class="btn block" data-act="another">ANOTHER FUTURE</button>' +
        '<div class="row"><button class="btn ghost" data-act="next-scenario">NEXT SCENARIO</button><button class="btn ghost" data-act="home">HOME</button></div>' +
      '</div>';
    renderCompareGrid();
  }

  function renderCompareGrid() {
    var mine = S.result, alt = S.alts[S.altIndex];
    function head(r, who, label) {
      return '<div class="cmp-col-h tone-' + (r.future.tone || 'blue') + '"><span class="who">' + who + '</span>' +
        '<div class="mini">' + art.globe({ spread: true, cls: 'spreading' }) + '</div>' +
        '<span class="pick">「' + esc(label) + '」</span><h3>' + esc(r.future.title) + '</h3><span class="yr">' + r.year + '年</span></div>';
    }
    var rows = ASPECTS.map(function (a) {
      var k = a[0], v1 = mine.metrics[k], v2 = alt.metrics[k];
      var diff = v2 > v1 + 2 ? ' diff-up' : (v2 < v1 - 2 ? ' diff-down' : '');
      function cell(r, v, extra) {
        return '<div class="cmp-cell tone-' + (r.future.tone || 'blue') + extra + '"><div class="v"><div class="meter"><i data-w="' + v + '"></i></div><span>' + v + '</span></div>' +
          '<p>' + esc(r.future[k]) + '</p></div>';
      }
      return '<div class="cmp-row-label"><b>' + a[1] + '</b>' + a[2] + '</div>' + cell(mine, v1, '') + cell(alt, v2, diff);
    }).join('');
    var path = alt.chain.map(function (st) {
      return '<li>' + esc(st.type === 'decision' ? '「' + st.option.label + '」' : st.event.title) + '</li>';
    }).join('');
    var slot = ui.$('#cmp-slot');
    slot.innerHTML =
      '<div class="cmp-grid">' + head(mine, 'YOUR FUTURE', mine.steps[0].option.label) + head(alt, 'ANOTHER FUTURE', alt.firstOption.label) + rows + '</div>' +
      '<div class="cmp-path"><div class="sec-h"><h2>Another Chain</h2><span>もうひとつの因果</span></div><ol>' + path + '</ol>' +
      '<p class="note">※ 数値はゲーム内の架空のシミュレーション値です。2回目以降の選択は、あなたと同じ選択（できない場合はいちばん自然な行動）で計算しています。</p></div>';
    OSC.anim.fillMeters(slot, 250);
  }

  /* =========================================================
     HOW TO PLAY
     ========================================================= */
  function openHowto() {
    var steps = [
      ['eye', '日常の出来事に出会う', 'コンビニ、駅、公園。どこにでもある、ありふれた場面です。'],
      ['hand', '自分の行動を選ぶ', '選べるのは「あなたの行動」だけ。正解も不正解もありません。'],
      ['branch', '世界が自動で動きだす', '出来事が線でつながり、周りの人、地域、国、世界へと広がっていきます。途中で何度か、また選択の場面が来ます。'],
      ['compare', '選ばなかった未来と比べる', '最初の選択を変えると、因果はすべて計算し直されます。']
    ];
    ui.$('#howto-card').innerHTML =
      '<div class="head"><h2 id="howto-title">HOW TO PLAY</h2><button class="icon-btn" data-act="close-howto" aria-label="閉じる">' + art.icon('close') + '</button></div>' +
      '<ol class="howto-steps">' + steps.map(function (s) {
        return '<li><span class="ic">' + art.icon(s[0]) + '</span><span><b>' + s[1] + '</b><span>' + s[2] + '</span></span></li>';
      }).join('') + '</ol>' +
      '<div class="howto-tips"><div>シミュレーション中は、画面をタップすると次の出来事へ進みます。</div><div>下のボタンで表示の速さ（0.5× / 1× / 2×）を変えたり、SKIPで一気に進めたりできます。</div><div>1回のプレイは約5分。記録はこの端末のブラウザに保存されます。</div></div>' +
      '<div id="reset-zone"><button class="link-danger" data-act="reset-ask">記録をすべて消す</button></div>' +
      '<button class="btn block" data-act="close-howto">OK</button>';
    var m = ui.$('#howto');
    m.classList.add('open');
    store.markHowto();
    setTimeout(function () { var b = m.querySelector('.icon-btn'); if (b) b.focus({ preventScroll: true }); }, 300);
  }
  function closeHowto() { ui.$('#howto').classList.remove('open'); }

  /* =========================================================
     操作（ボタン）の受付
     ========================================================= */
  var ACTIONS = {
    start: function () { openScenario(nextUnplayed().id, 'home'); },
    'continue': function () { restore(store.session); },
    collection: function () { renderCollection(); show('collection'); },
    howto: openHowto,
    'close-howto': closeHowto,
    home: function () { renderHome(); show('home'); },
    'open-scenario': function (b) { openScenario(b.dataset.id, 'collection'); },
    'back-scenario': function () { if (S.from === 'collection') ACTIONS.collection(); else ACTIONS.home(); },
    'to-choice': function () { renderChoice(); show('choice'); },
    'back-choice': function () { renderScenario(); show('scenario'); },
    'pick-first': pickFirst,
    compare: openCompare,
    'back-compare': function () { renderFuture(S.result); show('future'); OSC.anim.fillMeters(ui.$('#future-body'), 400); var g = ui.$('#future-body .globe'); if (g) g.classList.add('spreading'); },
    alt: function (b) {
      S.altIndex = +b.dataset.i;
      ui.$$('.cmp-tab').forEach(function (t) { t.setAttribute('aria-selected', String(t === b)); });
      renderCompareGrid();
    },
    another: function () {
      S.lastFirst = S.answers.d1;
      S.another = true;
      S.answers = {}; S.result = null; S.alts = null; S.recorded = false;
      renderChoice();
      show('choice');
    },
    'next-scenario': function () {
      var i = OSC.scenarios.indexOf(S.scn);
      openScenario(OSC.scenarios[(i + 1) % OSC.scenarios.length].id, S.from);
    },
    'reset-ask': function () {
      ui.$('#reset-zone').innerHTML = '<div class="confirm-row">発見した未来と履歴を消しますか？<button data-act="reset-yes">消す</button><button data-act="reset-no">やめる</button></div>';
    },
    'reset-yes': function () { store.reset(); closeHowto(); renderHome(); show('home'); ui.toast('記録を消しました'); },
    'reset-no': function () { ui.$('#reset-zone').innerHTML = '<button class="link-danger" data-act="reset-ask">記録をすべて消す</button>'; }
  };

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) {
      if (e.target.id === 'howto') closeHowto();
      return;
    }
    var fn = ACTIONS[b.dataset.act];
    if (fn) fn(b);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeHowto();
  });

  /* ---------- 途中から再開 ---------- */
  function restore(ses) {
    var scn = ses && OSC.getScenario(ses.scenarioId);
    if (!scn || !STEP_SCREENS[ses.screen]) { renderHome(); show('home'); return; }
    S.scn = scn;
    S.answers = ses.answers || {};
    S.recorded = !!ses.recorded;
    S.another = !!ses.another;
    S.lastFirst = ses.lastFirst || null;
    S.result = null; S.alts = null;
    if (ses.screen === 'scenario') { renderScenario(); show('scenario'); return; }
    if (ses.screen === 'choice' || !S.answers.d1) { renderChoice(); show('choice'); return; }
    var r = E.run(scn, S.answers);
    if (r.pending || ses.screen === 'sim') { startSim(true); return; }
    S.result = r;
    if (ses.screen === 'compare') { S.recorded = true; openCompare(); return; }
    openFuture();
  }

  /* ---------- 起動 ---------- */
  function boot() {
    ui.$$('.icon-btn[data-act]').forEach(function (b) {
      if (!b.innerHTML.trim()) b.innerHTML = art.icon(b.dataset.act === 'home' ? 'home' : 'back');
    });
    ui.$$('.progress[data-progress]').forEach(function (p) {
      var n = +p.dataset.progress;
      var labels = ['導入', '選択', '連鎖', '未来', '比較'];
      p.setAttribute('aria-label', '進行状況：' + labels[n] + '（' + (n + 1) + '/5）');
      p.innerHTML = labels.map(function (l, i) { return '<i class="' + (i < n ? 'on' : i === n ? 'now' : '') + '"></i>'; }).join('');
    });
    ui.$$('.screen').forEach(function (sc) {
      var tb = sc.querySelector('.topbar');
      if (!tb) return;
      sc.addEventListener('scroll', function () { tb.classList.toggle('is-scrolled', sc.scrollTop > 4); }, { passive: true });
    });
    OSC.Sim.init({
      onAnswer: function (answers) { S.answers = answers; store.setSession({ scenarioId: S.scn.id, answers: answers, screen: 'sim', recorded: false, another: S.another, lastFirst: S.lastFirst }); },
      onFuture: function (r) { S.result = r; openFuture(); },
      onDone: function (r) { S.result = r; }
    });
    renderHome();
    var ses = store.session;
    if (ses && OSC.getScenario(ses.scenarioId) && STEP_SCREENS[ses.screen]) restore(ses);
    else show('home');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
